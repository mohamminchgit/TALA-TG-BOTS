version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talatg}
      POSTGRES_USER: ${POSTGRES_USER:-talatg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talatg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talatg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://talatg:talatg@postgres:5432/talatg}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "main.py", "engine"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent-source:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://talatg:talatg@postgres:5432/talatg}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "main.py", "agent", "--name", "source"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent-destination:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://talatg:talatg@postgres:5432/talatg}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "main.py", "agent", "--name", "destination"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://talatg:talatg@postgres:5432/talatg}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "main.py", "admin"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

